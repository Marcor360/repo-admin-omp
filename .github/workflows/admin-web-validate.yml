name: Admin web validation

on:
  push:
    branches:
      - main
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-validate.yml'
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
